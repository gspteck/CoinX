<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found • CoinX</title>
    <meta name="description" content="Sorry, the page you are looking for could not be found. Explore CoinX cryptocurrency projects including CoinDrop." />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://coinx.gspteck.com/" />

    <link rel="stylesheet" href="/stylesheets/style.css" />

    <style>
      .error-container {
        min-height: 70vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px 20px;
      }
      .error-container h1 {
        font-size: 72px;
        margin: 0 0 12px;
        line-height: 1;
      }
      .error-container h2 {
        font-size: 24px;
        margin: 0 0 24px;
        font-weight: 600;
      }
      .error-container p {
        max-width: 480px;
        margin: 0 auto 32px;
        color: #555;
      }
      .error-actions {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #fff;
        color: #0A100D;
        border: 3px solid #0A100D;
        padding: 12px 24px;
        font-size: 15px;
        font-family: "IBM Plex Mono", monospace;
        font-weight: 700;
        border-radius: 999px;
        text-decoration: none;
      }
      .btn.primary {
        background: #F1AB86;
      }
    </style>
  </head>
  <body>
    <div id="nav-wrapper" style="padding: 20px 40px;">
      <h2><a href="/" style="text-decoration:none;">CoinX</a></h2>
    </div>

    <div class="error-container">
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>
        The page you're looking for doesn't exist or may have been moved.
        Explore our cryptocurrency projects below.
      </p>

      <div class="error-actions">
        <a href="/" class="btn primary">Back to Projects</a>
        <a href="/coindrop" class="btn">Explore CoinDrop</a>
        <a href="/swappr" class="btn">Explore Swappr</a>
      </div>
    </div>

    <footer>
      <p>
        Created by <a href="https://gspteck.com" target="_blank">gspteck</a>
      </p>
    </footer>
  </body>
</html>
